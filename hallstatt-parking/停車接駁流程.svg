<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="960" viewBox="0 0 1000 960"><style>text{font-family:-apple-system,BlinkMacSystemFont,PingFang TC,sans-serif;fill:#253c45}.head{font-weight:700;font-size:34px}.title{font-size:25px;font-weight:700}.sub{font-size:20px}</style><rect width="1000" height="960" rx="25" fill="#f7f2e7"/><text x="45" y="62" class="head">哈修塔特｜P1 停車與 Hallberg 接駁</text><text x="45" y="105" class="sub">抵達先辦停車票・接駁載人與行李・回程需聯絡</text><g transform="translate(35,135)"><rect width="930" height="128" rx="18" fill="#ffffff"/><circle cx="40" cy="38" r="24" fill="#cc6f40"/><text x="40" y="46" text-anchor="middle" style="fill:white;font-size:22px;font-weight:700">01</text><g transform="translate(80,24)"><rect x="12" y="2" width="65" height="62" rx="9" fill="#265e71"/><text x="44" y="45" fill="white" font-size="38" text-anchor="middle">P</text><path d="M7 80H92M76 80V53M76 54H103" fill="none" stroke="#cc6f40" stroke-width="6"/></g><text x="207" y="43" class="title">開車到 P1，入口取票</text><text x="207" y="81" class="sub">保留原停車票，再停車、卸行李。</text></g><g transform="translate(35,283)"><rect width="930" height="128" rx="18" fill="#ffffff"/><circle cx="40" cy="38" r="24" fill="#cc6f40"/><text x="40" y="46" text-anchor="middle" style="fill:white;font-size:22px;font-weight:700">02</text><g transform="translate(80,24)"><rect x="18" y="0" width="63" height="85" rx="9" fill="#265e71"/><rect x="26" y="9" width="47" height="28" rx="3" fill="#c6e5dc"/><text x="49" y="28" font-size="11" text-anchor="middle">Hotel</text><path d="M30 48H69" stroke="white" stroke-width="4"/><rect x="37" y="49" width="27" height="24" fill="#f7dfb0"/><path d="M43 56H57M43 63H57" stroke="#265e71" stroke-width="2"/></g><text x="207" y="43" class="title">繳費機換 Hotel-Ticket</text><text x="207" y="81" class="sub">插入原票 → 選住宿票 → 選停留期間 → 付款。</text></g><g transform="translate(35,431)"><rect width="930" height="128" rx="18" fill="#ffffff"/><circle cx="40" cy="38" r="24" fill="#cc6f40"/><text x="40" y="46" text-anchor="middle" style="fill:white;font-size:22px;font-weight:700">03</text><g transform="translate(80,24)"><rect x="4" y="15" width="92" height="49" rx="12" fill="#265e71"/><path d="M14 25H78V44H14Z" fill="#c6e5dc"/><circle cx="24" cy="65" r="9" fill="#253c45"/><circle cx="76" cy="65" r="9" fill="#253c45"/></g><text x="207" y="43" class="title">向司機／資訊點報到</text><text x="207" y="81" class="sub">告知 Hallberg，Seestraße 113；帶好行李。</text></g><g transform="translate(35,579)"><rect width="930" height="128" rx="18" fill="#ffffff"/><circle cx="40" cy="38" r="24" fill="#cc6f40"/><text x="40" y="46" text-anchor="middle" style="fill:white;font-size:22px;font-weight:700">04</text><g transform="translate(80,24)"><path d="M2 24L47 0L92 24" fill="#cc6f40"/><rect x="10" y="24" width="74" height="57" fill="#f4cf8a"/><rect x="38" y="51" width="18" height="30" fill="#265e71"/><path d="M23 34V45M68 34V45" stroke="#265e71" stroke-width="9"/></g><text x="207" y="43" class="title">接駁送往住宿</text><text x="207" y="81" class="sub">統一住宿接駁；09:00–19:00，每半小時一班。</text></g><g transform="translate(35,727)"><rect width="930" height="128" rx="18" fill="#ffffff"/><circle cx="40" cy="38" r="24" fill="#cc6f40"/><text x="40" y="46" text-anchor="middle" style="fill:white;font-size:22px;font-weight:700">05</text><g transform="translate(80,24)"><path d="M74 27C26 -5 4 40 28 65M28 65L11 57M28 65L28 45" stroke="#265e71" stroke-width="7" fill="none"/><rect x="53" y="52" width="33" height="26" rx="4" fill="#cc6f40"/><text x="69" y="72" fill="white" font-size="21" text-anchor="middle">P</text></g><text x="207" y="43" class="title">離開前安排回 P1</text><text x="207" y="81" class="sub">電話或請住宿安排；09:00 回程尚未預約。</text></g><text x="45" y="915" font-size="17">操作示意，非現場機器畫面；規則依 P1 官方公告，查證 2026/10/02。</text></svg>