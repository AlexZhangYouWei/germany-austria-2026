<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0806">
<title>出發前準備清單｜德國・奧地利</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="checklist">

<nav><div class="navbar" id="nav"></div></nav>


<main class="wrap">
  <div class="pagehead">
    <div class="eyebrow">Checklist</div>
    <h1>出發前準備清單</h1>
    <p class="sub">這是個人清單：每個人在自己的裝置上各自勾選，狀態不會同步給其他人。標註（駕駛人）（導航者）（訂房人）的項目只有該負責人需要處理。</p>
  </div>
  <p class="ck-note-store" id="cknostore" hidden>這個瀏覽器不允許儲存資料（可能是無痕模式），勾選在重新整理後不會被記住。</p>
  <div class="ck-top glass rv">
    <div class="ck-topline">
      <span class="ck-num" id="cknum">0／0</span>
      <span class="ck-state" id="ckstate"></span>
    </div>
    <div class="ck-track"><i id="ckbar" style="width:0%"></i></div>
    <div class="ck-actions"><button type="button" class="ck-btn" id="ckreset">全部重設</button></div>
  </div>
  <div class="ckgrid" id="ckroot"></div>
</main>

<footer class="wrap">
  <div>資料來源：德奧旅行_行程總檔.md</div>
  <div>住宿與航班核對日 2026-09-14　·　預報發布 2026-09-20 05:48 UTC</div>
  <div>預報取自 DWD ICON 與 ECMWF IFS 數值模式，每天各自採用射程內解析度最高者；
       會隨時間過期，請以 DWD WarnWetter 與 GeoSphere Austria 的即時預報為準。</div>
</footer>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
